<div class="activity-card">

    <div class="activity-icon">

        <mat-icon>

            {{ activity.icon }}

        </mat-icon>

    </div>

    <div class="activity-content">

        <span class="activity-time">

            {{ activity.startTime }} - {{ activity.endTime }}

        </span>

        <h3>

            {{ activity.title }}

        </h3>

        <p>

            {{ activity.description }}

            • {{ activity.locationName }}

        </p>

    </div>

</div>
