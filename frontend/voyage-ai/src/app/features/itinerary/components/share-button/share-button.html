<div class="share-container">

    <button
        mat-stroked-button
        class="share-btn"
        (click)="share()">

        <mat-icon>

            share

        </mat-icon>

        Share

    </button>

    <button
        mat-flat-button
        color="primary"
        class="pdf-btn"
        (click)="exportPdf()">

        <mat-icon>

            picture_as_pdf

        </mat-icon>

        Export PDF

    </button>

</div>
