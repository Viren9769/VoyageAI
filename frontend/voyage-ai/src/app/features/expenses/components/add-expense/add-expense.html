<div class="overlay" *ngIf="isOpen" (click)="onClose()">
	<section class="modal" (click)="$event.stopPropagation()">
		<header>
			<h3>Add Expense</h3>
			<button type="button" (click)="onClose()">X</button>
		</header>

		<form (ngSubmit)="onSave()">
			<div class="field">
				<label>Date</label>
				<input type="date" name="date" [(ngModel)]="model.date" required />
			</div>

			<div class="field">
				<label>Description</label>
				<input type="text" name="description" [(ngModel)]="model.description" required />
			</div>

			<div class="field">
				<label>Note</label>
				<input type="text" name="note" [(ngModel)]="model.note" />
			</div>

			<div class="split">
				<div class="field">
					<label>Category</label>
					<select name="category" [(ngModel)]="model.category">
						<option *ngFor="let category of categories" [value]="category">{{ category }}</option>
					</select>
				</div>

				<div class="field">
					<label>Payment Method</label>
					<select name="paymentMethod" [(ngModel)]="model.paymentMethod">
						<option *ngFor="let method of paymentMethods" [value]="method">{{ method }}</option>
					</select>
				</div>
			</div>

			<div class="field">
				<label>Amount</label>
				<input type="number" name="amount" min="0" step="0.01" [(ngModel)]="model.amount" required />
			</div>

			<footer>
				<button type="button" class="ghost" (click)="onClose()">Cancel</button>
				<button type="submit" class="primary">Save Expense</button>
			</footer>
		</form>
	</section>
</div>
