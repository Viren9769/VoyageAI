<section class="trip-panel">
	<div class="panel-head">
		<h3>Select Trip</h3>
		<button mat-stroked-button type="button" class="new-trip-btn">
			<mat-icon>add</mat-icon>
			New Trip
		</button>
	</div>

	<div class="trip-list">
		<button
			type="button"
			class="trip-card"
			*ngFor="let trip of trips"
			[class.active]="trip.id === selectedTripId"
			(click)="onTripChange(trip.id)">
			<img [src]="trip.coverImage || 'images/switzerland.jpg'" [alt]="trip.title" class="trip-cover" />

			<div class="trip-meta">
				<h4>{{ trip.title }}</h4>
				<p>{{ trip.startDate | date:'MMM d' }} - {{ trip.endDate | date:'MMM d, y' }} - {{ trip.days }} Days</p>
				<div class="status" [class]="'status ' + statusClass(trip.status)">
					<span class="dot"></span>
					{{ trip.status }}
				</div>
				<small>Budget: {{ trip.budget | currency:'USD':'symbol':'1.0-0' }}</small>
			</div>

			<mat-icon class="more">more_vert</mat-icon>
		</button>
	</div>

	<button type="button" class="view-btn">View All Trips</button>
</section>
