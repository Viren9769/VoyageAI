<section class="stats-grid">
	<article class="stat-card">
		<div class="icon purple"><mat-icon>group</mat-icon></div>
		<div>
			<p>Total Travelers</p>
			<h3>{{ stats.totalTravelers }}</h3>
		</div>
	</article>

	<article class="stat-card">
		<div class="icon orange"><mat-icon>person</mat-icon></div>
		<div>
			<p>Adults</p>
			<h3>{{ stats.adults }}</h3>
		</div>
	</article>

	<article class="stat-card">
		<div class="icon blue"><mat-icon>child_care</mat-icon></div>
		<div>
			<p>Children</p>
			<h3>{{ stats.children }}</h3>
		</div>
	</article>

	<article class="stat-card">
		<div class="icon green"><mat-icon>luggage</mat-icon></div>
		<div>
			<p>Upcoming Trips</p>
			<h3>{{ stats.upcomingTrips }}</h3>
		</div>
	</article>
</section>
